<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>החדשות של Hen | LiDa Software</title>
  <meta name="description" content="עדכוני חדשות אישיים — ישראל, רומניה וטכנולוגיה בעברית." />
  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/x-icon" href="/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Versioned news assets + Vercel revalidation prevent stale UI after deploys. -->
  <link rel="stylesheet" href="/news/css/style.css?v=20260822-1024" />
  <link rel="stylesheet" href="/news/css/market-bar.css?v=20260822-1024" />
  <link rel="stylesheet" href="/news/css/side-rails.css?v=20260822-1024" />
  <link rel="stylesheet" href="/news/css/breaking-ticker.css?v=20260822-1024" />
  <link rel="stylesheet" href="/news/css/news-media.css?v=20260822-1024" />
  <link rel="stylesheet" href="/news/css/news-experience.css?v=20260822-1024" />
  <link rel="stylesheet" href="/news/css/news-ui-fixes.css?v=20260822-1024" />
  <link rel="stylesheet" href="/news/css/news-search.css?v=20260822-1038" />
  <link rel="stylesheet" href="/news/css/news-footer.css?v=20260822-1024" />
</head>
<body class="news-page-body">

  <main class="news-app" dir="rtl" lang="he">

    <!-- Utility Bar -->
    <div class="utility-bar" id="utilityBar">
      <div class="utility-bar-inner">
        <span id="utilDate"></span>
        <span class="util-sep">|</span>
        <span id="utilClock"></span>
        <span class="util-sep">|</span>
        <a href="/hennews2409" class="util-link">ראשי</a>
        <span class="util-sep">|</span>
        <span class="util-weather-wrap">
          <button class="util-link util-weather-btn" id="weatherToggleBtn" aria-label="מזג אוויר">☀ מזג אוויר</button>
          <div class="weather-panel hidden" id="weatherPanel">
            <div class="weather-panel-header">
              <span class="weather-panel-title">מזג אוויר</span>
              <button class="weather-panel-close" id="weatherCloseBtn" aria-label="סגור">✕</button>
            </div>
            <div class="weather-panel-body">
              <div class="weather-city" id="weatherTelAviv">
                <div class="weather-city-label">תל אביב</div>
                <div class="weather-city-data">טוען...</div>
              </div>
              <div class="weather-city" id="weatherBucharest">
                <div class="weather-city-label">בוקרשט</div>
                <div class="weather-city-data">טוען...</div>
              </div>
            </div>
            <div class="weather-panel-footer">
              <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer" class="weather-full-link">מקור נתונים: Open-Meteo ↗</a>
            </div>
          </div>
        </span>
      </div>
    </div>

    <!-- News Header -->
    <header class="news-header">
      <div class="news-container">
        <h1 class="editorial-headline">
          <a href="/hennews2409" aria-label="החדשות של Hen">
            <img src="/news/sources/logo.png" alt="החדשות של Hen" class="site-logo" />
          </a>
        </h1>
      </div>
    </header>

    <!-- Sticky Nav -->
    <div class="sticky-nav-wrapper">
      <nav class="feed-nav" aria-label="Feed Navigation">
        <button class="feed-btn feed-btn-archive" data-feed="archive" aria-label="פתח ארכיון חדשות">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7.5h16M6.5 7.5v10.25A1.25 1.25 0 0 0 7.75 19h8.5a1.25 1.25 0 0 0 1.25-1.25V7.5M8.5 4.5h7l1 3h-9l1-3ZM9.5 11.5h5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>ארכיון</span>
        </button>

        <div class="feed-nav-primary" aria-label="ערוצי חדשות">
          <button class="feed-btn active" data-feed="romania">רומניה</button>
          <button class="feed-btn" data-feed="israel">ישראל</button>
          <button class="feed-btn" data-feed="technology">טכנולוגיה</button>
        </div>

        <div id="lastUpdated" class="last-updated">עודכן לאחרונה: --:--</div>
      </nav>
    </div>

    <div class="news-container">
       
       <!-- Search & Archive Section -->
       <div id="searchSection" class="search-section hidden">
         <div class="search-header">
           <div class="search-title-wrap">
             <span class="search-kicker">HEN NEWS ARCHIVE</span>
             <h2>חיפוש וארכיון</h2>
             <p class="search-subtitle">מצא כתבות לפי מילות מפתח, ערוץ חדשות וטווח זמן.</p>
           </div>
           <button id="closeSearchBtn" class="close-btn" aria-label="סגור חיפוש">
             <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
               <line x1="18" y1="6" x2="6" y2="18"></line>
               <line x1="6" y1="6" x2="18" y2="18"></line>
             </svg>
           </button>
         </div>

         <div class="search-controls">
           <div class="search-bar-wrapper">
             <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
               <circle cx="11" cy="11" r="8"></circle>
               <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
             </svg>
             <input type="text" id="searchInput" placeholder="חפש נושא, חברה או כתבה... לדוגמה OpenAI" aria-label="חיפוש חדשות" autocomplete="off" />
             <button id="clearSearchBtn" class="clear-search-btn hidden" aria-label="נקה חיפוש">
               <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                 <line x1="18" y1="6" x2="6" y2="18"></line>
                 <line x1="6" y1="6" x2="18" y2="18"></line>
               </svg>
             </button>
           </div>

           <div class="search-filter-label">סינון תוצאות</div>
           <div class="search-filters">
             <div class="filter-group">
               <label for="feedFilter">ערוץ חדשות</label>
               <select id="feedFilter">
                 <option value="">כל הערוצים</option>
                 <option value="israel">ישראל</option>
                 <option value="romania">רומניה</option>
                 <option value="technology">טכנולוגיה</option>
               </select>
             </div>
             
             <div class="filter-group">
               <label for="dateFilter">תקופה</label>
               <select id="dateFilter">
                 <option value="any">כל הזמן</option>
                 <option value="week">השבוע</option>
                 <option value="month">החודש</option>
                 <option value="custom">טווח תאריכים...</option>
               </select>
             </div>
             
             <div id="customDateRange" class="filter-group custom-date-range hidden">
               <input type="date" id="dateFrom" aria-label="מתאריך" />
               <span>עד</span>
               <input type="date" id="dateTo" aria-label="עד תאריך" />
             </div>
           </div>
           
           <div id="archiveWarning" class="archive-warning hidden"></div>
           <div class="archive-search-footnote">
             <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
               <circle cx="12" cy="12" r="9" stroke-width="1.7"/>
               <path d="M12 10.5v5M12 7.5h.01" stroke-width="1.9" stroke-linecap="round"/>
             </svg>
             <span>אפשר לחפש גם בלי טקסט: בחר ערוץ או תקופה כדי לדפדף בארכיון.</span>
           </div>
         </div>
       </div>
       
       <div id="newsError" class="news-error hidden"></div>
       
       <!-- Main Content Container -->
       <div id="newsContent" class="news-content-area">
          <!-- Populated by JS -->
       </div>
    </div>
  </main>

  <!-- Persistent newsroom intelligence footer -->
  <footer id="newsroomFooter" class="newsroom-footer" aria-label="HEN NEWS Newsroom"></footer>
  
  <script src="/news/js/news-api.js?v=20260822-1024"></script>
  <script src="/news/js/app.js?v=20260822-1024"></script>
  <script src="/news/js/news-media.js?v=20260822-1024"></script>
  <script src="/news/js/weather-v2.js?v=20260822-1024"></script>
  <script src="/news/js/market-bar.js?v=20260822-1024"></script>
  <script src="/news/js/israel-support.js?v=20260822-1024"></script>
  <script src="/news/js/side-rails.js?v=20260822-1024"></script>
  <script src="/news/js/breaking-ticker.js?v=20260822-1024"></script>
  <script src="/news/js/news-experience.js?v=20260822-1024"></script>
  <script src="/news/js/news-ui-fixes.js?v=20260822-1024"></script>
  <script src="/news/js/article-page-fixes.js?v=20260822-1024"></script>
  <script src="/news/js/news-footer.js?v=20260822-1024"></script>
</body>
</html>
